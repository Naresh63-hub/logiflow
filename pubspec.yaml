name: logistics_app
description: "Production-Style Cross-Platform Shipment Tracking & Proof-of-Delivery System for 3PL Logistics"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend & Network
  supabase_flutter: ^2.8.4
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

  # Offline Database (Drift + SQLite)
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Hardware & Native Features
  mobile_scanner: ^6.0.4
  image_picker: ^1.1.2
  signature: ^5.5.0
  geolocator: ^13.0.2

  # Security & Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Utilities & Localization
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
